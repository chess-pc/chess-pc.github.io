<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>豆丁互娱</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1"/>

    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #GameDiv {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #GameCanvas {
        display: block;
      }

      #StartupLoading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04090a;
      }

      #StartupLoading img {
        width: 96px;
        height: 96px;
        animation: startup-loading-spin 1.2s linear infinite;
      }

      @keyframes startup-loading-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="StartupLoading" role="status" aria-label="正在加载">
      <img src="./loading-arrow.png" alt=""/>
    </div>

    <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="960" tabindex="99"></canvas>
      </div>
    </div>
    <!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>
  </body>
</html>
